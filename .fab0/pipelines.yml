# yaml-language-server: $schema=https://schema.fab0.dev/pipeline.v1.json
# fab0-dev/fab0 T2.21 (AC2.18): three documents, the third one invalid.
version: 1
name: triage
people:
  po: [eugenefurs]
status:
  labels: [Todo, Ready, Done]
  end: Done
start: { type: Bug, status: Ready, by: [po] }
escalate: [po]
types:
  Bug:
    steps:
      close:
        on: { status: Ready }
        do: github.label
        label: Done
---
version: 1
name: chores
people:
  po: [eugenefurs]
status:
  labels: [Todo, Ready, Done]
  end: Done
start: { type: Task, status: Ready, by: [po] }
escalate: [po]
types:
  Task:
    steps:
      finish:
        on: { status: Ready }
        do: github.label
        label: Done
---
version: 1
name: broken
status:
  labels: [Todo, Done]
  end: Finished
start: { type: Feature, status: Ready, by: [po] }
types:
  Feature:
    steps:
      go:
        on: { status: Ready }
        do: github.nothing
# T2.22 re-sync
