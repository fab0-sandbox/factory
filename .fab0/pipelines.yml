# yaml-language-server: $schema=https://schema.fab0.dev/pipeline.v1.json
# fab0-dev/fab0 stage 3 (spec section 5): the dev checks' pipeline, the same document as fab0-sandbox/factory's.
version: 1
name: record-flow
description: A Feature planned, its Stories done by their assignees, finished when every Story is Done.
people:
  po: [eugenefurs]
status:
  labels: [Todo, Ready, InProgress, Done]
  end: Done
start: { type: Feature, status: Ready, by: [po] }
escalate: [po]
limits: { act_timeout: 2m, resync_interval: 15m }
types:
  Feature:
    steps:
      plan:
        on: { status: Ready }
        do: agent.record
        skill: plan-feature
        approve: none
        on_done: [{ label: InProgress }]
      finish:
        on: { children: { type: Story, all: Done } }
        do: github.label
        label: Done
  Story:
    parent: Feature
    steps:
      do:
        on: { status: Ready }
        do: agent.record
        skill: do-story
        approve: none
        on_done: [{ label: Done }]
---
# fab0-dev/fab0 stage 5 (spec section 5): the routine checks' pipeline. Its own status labels keep it off
# record-flow's Features (D.8).
version: 1
name: routine-flow
description: Each Story of a Feature specced by its assignee's routine and reviewed by the other member, finished when every Story is Specced.
people: { team: [eugenefurs, jev-fab0] }
status: { labels: [Queued, Spec, Specced], end: Specced }
start: { type: Feature, status: Spec, by: [eugenefurs] }
escalate: [eugenefurs]
limits: { settle: 2m, act_timeout: 30m, launch_timeout: 10m }
types:
  Feature:
    steps:
      finish: { on: { children: { type: Story, all: Specced } }, do: github.label, label: Specced }
  Story:
    parent: Feature
    steps:
      spec:
        on: { status: Spec }
        do: agent.routine
        skill: spec-story
        model: small
        makes: pr
        kind: spec
        limits: { timeout: 30m }
        approve: { human: [team], via: review }
        on_done: [{ label: Specced }]
---
# fab0-dev/fab0 stage 6 (spec section 5): the full-flow checks' pipeline, recipes/full-flow.yml. Its own status
# labels keep it off record-flow's and routine-flow's Features (D.8).
version: 1
name: full-flow
description: A Feature planned into Stories under a budget; each Story specced, reviewed and planned in order, behind its blockers.
people: { po: [eugenefurs], team: [eugenefurs, jev-fab0] }
status: { labels: [Queue, Go, Doing, Shipped], end: Shipped }
start: { type: Feature, status: Go, by: [po] }
escalate: [po]
limits: { settle: 2m, act_timeout: 5m, launch_timeout: 10m, stall_timeout: 20m, items: 8, generations: 1 }
types:
  Feature:
    steps:
      plan:
        on: { status: Go }
        do: agent.record
        skill: plan-feature
        makes: issues
        spawn: { type: Story, budget: 2 }
        approve: { human: [po], via: command }
      ship: { on: { children: { type: Story, all: Shipped } }, do: github.label, label: Shipped }
  Story:
    parent: Feature
    steps:
      spec:
        on: { status: Go }
        gates: [{ dependencies: resolved }]
        do: agent.routine
        skill: spec-story
        model: small
        makes: pr
        kind: spec
        approve: auto
        limits: { timeout: 30m, retries: 0, revisions: 1 }
      review-spec: { reviews: spec, do: agent.routine, skill: review-spec, model: small }
      plan:
        on: { status: Go }
        gates: [{ after: spec }, { command: /plan, by: [po] }]
        do: agent.record
        skill: plan-story
        approve: none
        limits: { retries: 0 }
        on_done: [{ label: Shipped }]
