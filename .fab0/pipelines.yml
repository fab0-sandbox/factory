# yaml-language-server: $schema=https://schema.fab0.dev/pipeline.v1.json
# fab0-dev/fab0 stage 3 (spec section 5): the dev checks' pipeline, the same document as fab0-sandbox/factory's.
version: 1
name: record-flow
description: A Feature planned, its Stories done by their assignees, finished when every Story is Done.
people:
  po: [eugenefurs]
status:
  labels: [Todo, Ready, InProgress, Done]
  end: Done
start: { type: Feature, status: Ready, by: [po] }
escalate: [po]
limits: { act_timeout: 2m, resync_interval: 15m }
types:
  Feature:
    steps:
      plan:
        on: { status: Ready }
        do: agent.record
        skill: plan-feature
        approve: none
        on_done: [{ label: InProgress }]
      finish:
        on: { children: { type: Story, all: Done } }
        do: github.label
        label: Done
  Story:
    parent: Feature
    steps:
      do:
        on: { status: Ready }
        do: agent.record
        skill: do-story
        approve: none
        on_done: [{ label: Done }]
---
# fab0-dev/fab0 stage 5 (spec section 5): the routine checks' pipeline. Its own status labels keep it off
# record-flow's Features (D.8).
version: 1
name: routine-flow
description: Each Story of a Feature specced by its assignee's routine and reviewed by the other member, finished when every Story is Specced.
people: { team: [eugenefurs, jev-fab0] }
status: { labels: [Queued, Spec, Specced], end: Specced }
start: { type: Feature, status: Spec, by: [eugenefurs] }
escalate: [eugenefurs]
limits: { settle: 2m, act_timeout: 30m, launch_timeout: 10m }
types:
  Feature:
    steps:
      finish: { on: { children: { type: Story, all: Specced } }, do: github.label, label: Specced }
  Story:
    parent: Feature
    steps:
      spec:
        on: { status: Spec }
        do: agent.routine
        skill: spec-story
        model: small
        makes: pr
        kind: spec
        limits: { timeout: 30m }
        approve: { human: [team], via: review }
        on_done: [{ label: Specced }]
